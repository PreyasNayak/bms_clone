<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CineBook</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">🎬 CineBook</div>
            <div class="nav-links">
                <a href="/" class="btn-link">Home</a>
                <a href="/register" class="btn-link">Register</a>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-form">
            <h1>Welcome Back</h1>
            <p>Sign in to your account</p>
            {% if error %}
                <div class="error-message">{{ error }}</div>
            {% endif %}
            <form method="post" class="form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
            <p class="form-footer">Don't have an account? <a href="/register">Register here</a></p>
        </div>
    </div>
</body>
</html>
